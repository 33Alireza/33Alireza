<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="394" viewBox="0 0 1000 394" role="img" aria-label="About Alireza Yousefzadeh">
<style>
text{font-family:'JetBrains Mono','Fira Code','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.a{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pl{animation:pulse 2.4s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.cb{animation:blink 1s steps(1) infinite}
.p{opacity:0;animation:pop .55s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a,.p{opacity:1}}
</style>
<rect x="1" y="1" width="998" height="392" rx="14" fill="#161b22" stroke="#2a3140"/>
<path d="M1 52H999" stroke="#2a3140"/>
<circle cx="28" cy="27" r="6" fill="#ff5f57" stroke="#e0443e" stroke-width=".75"/><circle cx="48" cy="27" r="6" fill="#febc2e" stroke="#dea123" stroke-width=".75"/><circle cx="68" cy="27" r="6" fill="#28c840" stroke="#1aab29" stroke-width=".75"/>
<text x="500" y="31" font-size="13" text-anchor="middle" fill="#9aa4b2">About</text>
<text class="a" x="36" y="94" font-size="15" style="animation-delay:0.2s" xml:space="preserve"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
<text class="a" x="36" y="118" font-size="15" style="animation-delay:0.5s" xml:space="preserve"><tspan fill="#9aa4b2">Alireza Yousefzadeh — Software Engineer, Android</tspan></text>
<text class="a" x="36" y="160" font-size="15" style="animation-delay:0.9s" xml:space="preserve"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">cat focus.md</tspan></text>
<text class="a" x="36" y="184" font-size="15" style="animation-delay:1.2s" xml:space="preserve"><tspan fill="#58a6ff">→ </tspan><tspan fill="#9aa4b2">Android development with Kotlin &amp; Jetpack Compose</tspan></text>
<text class="a" x="36" y="208" font-size="15" style="animation-delay:1.5s" xml:space="preserve"><tspan fill="#58a6ff">→ </tspan><tspan fill="#9aa4b2">Modern architecture: MVVM, Coroutines &amp; Flow, Hilt</tspan></text>
<text class="a" x="36" y="232" font-size="15" style="animation-delay:1.8s" xml:space="preserve"><tspan fill="#58a6ff">→ </tspan><tspan fill="#9aa4b2">Kotlin Multiplatform &amp; Compose Multiplatform</tspan></text>
<text class="a" x="36" y="256" font-size="15" style="animation-delay:2.1s" xml:space="preserve"><tspan fill="#58a6ff">→ </tspan><tspan fill="#9aa4b2">Networking &amp; APIs with Ktor</tspan></text>
<text class="a" x="36" y="298" font-size="15" style="animation-delay:2.5s" xml:space="preserve"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">ls projects/</tspan></text>
<text class="a" x="36" y="322" font-size="15" style="animation-delay:2.8s" xml:space="preserve"><tspan fill="#58a6ff">movino  kotlinfinity  androidbeyond  mobile-dev-roadmap</tspan></text>
<text class="a" x="36" y="358" font-size="15" style="animation-delay:3.2s" xml:space="preserve"><tspan fill="#58a6ff">$ </tspan><tspan class="cb" fill="#58a6ff">_</tspan></text>
<g class="a" style="animation-delay:.4s"><rect x="700" y="72" width="262" height="262" rx="12" fill="none" stroke="#3b4456" stroke-dasharray="4 6"/><text x="716" y="94" font-size="11" fill="#9aa4b2">DATA · KTOR · REPOSITORY</text></g>
<g class="a" style="animation-delay:.8s"><rect x="716" y="106" width="230" height="214" rx="10" fill="#1c2230" stroke="#3b4456"/><text x="730" y="128" font-size="11" fill="#9aa4b2">VIEWMODEL · COROUTINES · FLOW</text></g>
<g class="a" style="animation-delay:1.2s"><rect x="732" y="140" width="198" height="166" rx="8" fill="#0d1117" stroke="#2f81f7" stroke-opacity=".6"/><text x="746" y="162" font-size="11" fill="#58a6ff">STATE</text></g>
<g class="a" style="animation-delay:1.6s"><rect x="750" y="176" width="162" height="116" rx="8" fill="#2f81f7" fill-opacity=".16" stroke="#2f81f7" stroke-width="1.5"/><text class="pl" x="831" y="239" font-size="14" font-weight="700" text-anchor="middle" fill="#e6edf3">COMPOSE UI</text><text x="831" y="258" font-size="10" text-anchor="middle" fill="#9aa4b2">screens · components</text></g>
<text class="a" x="831" y="352" font-size="10" text-anchor="middle" fill="#9aa4b2" style="animation-delay:2s">state flows down, events flow up</text>

</svg>
