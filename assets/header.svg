<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Alireza Yousefzadeh, Android Developer">
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".09"/></pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2f81f7" stop-opacity=".34"/><stop offset="1" stop-color="#2f81f7" stop-opacity="0"/></radialGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
<clipPath id="scr"><rect x="778" y="51" width="104" height="186"/></clipPath>
